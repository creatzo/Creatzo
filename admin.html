<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creatzo Admin</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#18181b;--mu:#71717a;--bd:#e4e4e7;--ac:#6d28d9;--ok:#16a34a;--er:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#1a1a1f;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2e2e36;--ac:#8b5cf6;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:180px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);width:auto}
.btn:disabled{opacity:.5}
.sw{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.sw input{width:20px;height:20px}
.sw label{margin:0;font-weight:400}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:240px;overflow:auto}
#msg{margin-top:10px;font-size:14px;min-height:20px;word-break:break-word}
details summary{cursor:pointer;font-weight:600}
.hint{color:var(--mu);font-size:12.5px;margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>creatzo Admin</h1>

<div class="card">
<details id="set">
<summary>GitHub settings</summary>
<label>Token (fine-grained, sirf is repo ka Contents: Read and write)</label>
<input type="password" id="tok" autocomplete="off" placeholder="github_pat_...">
<label>Repo (owner/naam)</label>
<input type="text" id="repo" placeholder="username/creatzo">
<label>Branch</label>
<input type="text" id="br" value="main">
<label>Prompts file ka path</label>
<input type="text" id="path" value="prompts.js">
<label>Images folder</label>
<input type="text" id="dir" value="images">
<p class="hint">Ye sab sirf tumhare browser me save hota hai.</p>
</details>
</div>

<div class="card">
<label style="margin-top:0">Image</label>
<div class="row"><input type="text" id="img" placeholder="images/47.webp"><button class="btn sec" id="pick" type="button">Chuno</button></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="sw"><input type="checkbox" id="up" checked><label for="up">Chuni hui image GitHub par bhi upload karo</label></div>

<label>Title</label>
<input type="text" id="title" placeholder="Golden Halo Portrait">

<label>Tags</label>
<div class="chips" id="chips"></div>
<div class="row" style="margin-top:8px"><input type="text" id="ctag" placeholder="Naya tag"><button class="btn sec" id="addtag" type="button">Add</button></div>

<label>Prompt</label>
<textarea id="prompt" placeholder="Poora prompt paste karo..."></textarea>

<div class="sw"><input type="checkbox" id="wm"><label for="wm">Watermark pehle se bana hai (<code>watermark: false</code>)</label></div>
</div>

<div class="card">
<label style="margin-top:0">Preview</label>
<pre id="out"></pre>
<div style="margin-top:10px"><button class="btn" id="go" type="button">GitHub par daalo</button></div>
<div id="msg"></div>
</div>
</main>
<script>
var TAGS=['Trending','Boys','Girls','Black','Portrait','Photography','Green','Gredients','19s'],sel={Trending:true},picked=null;
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
['tok','repo','br','path','dir'].forEach(function(k){var v=ls('cz_'+k);if(v)$(k).value=v;$(k).addEventListener('input',function(){ls('cz_'+k,$(k).value.trim())})});
if(!$('tok').value||!$('repo').value)$('set').open=true;
function esc(s){return s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${')}
function q(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function chips(){var h=$('chips');h.innerHTML='';TAGS.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='chip'+(sel[t]?' on':'');b.textContent=t;b.onclick=function(){sel[t]=!sel[t];chips();build()};h.appendChild(b)})}
function build(){
  var c="  {\n    image: '"+q($('img').value.trim())+"',\n";
  if($('wm').checked)c+="    watermark: false,\n";
  c+="    title: '"+q($('title').value.trim())+"',\n    tags: ["+TAGS.filter(function(t){return sel[t]}).map(function(t){return "'"+q(t)+"'"}).join(', ')+"],\n";
  c+="    prompt: `"+esc($('prompt').value.trim())+"`\n  },";
  $('out').textContent=c;return c;
}
function msg(t,c){var m=$('msg');m.textContent=t;m.style.color=c||''}
function b64dec(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(s){var u=new TextEncoder().encode(s),r='';for(var i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(r)}
function fileB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}
function gh(method,url,body){
  return fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+$('tok').value.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.message||('Error '+r.status));e.status=r.status;throw e}return j});
  });
}
function enc(p){return p.split('/').map(encodeURIComponent).join('/')}
$('go').onclick=function(){
  var img=$('img').value.trim(),title=$('title').value.trim(),p=$('prompt').value.trim(),repo=$('repo').value.trim(),br=$('br').value.trim()||'main',path=$('path').value.trim(),tok=$('tok').value.trim();
  if(!tok||!repo||!path){$('set').open=true;msg('GitHub settings bharo.','var(--er)');return}
  if(!img||!title||!p){msg('Image, title aur prompt teeno zaroori hain.','var(--er)');return}
  var block=build(),btn=$('go');btn.disabled=true;msg('Prompts file padh raha hoon...');
  var base='/repos/'+repo+'/contents/';
  var step=Promise.resolve();
  if(picked&&$('up').checked){
    var ipath=(img.indexOf('/')<0?($('dir').value.trim()||'images')+'/':'')+img.replace(/^\.?\//,'');
    step=fileB64(picked).then(function(b){
      msg('Image upload ho rahi hai...');
      return gh('GET',base+enc(ipath)+'?ref='+encodeURIComponent(br)).then(function(j){return j.sha},function(e){if(e.status===404)return null;throw e}).then(function(sha){
        var body={message:'Add image: '+picked.name,content:b,branch:br};if(sha)body.sha=sha;return gh('PUT',base+enc(ipath),body);
      });
    });
  }
  step.then(function(){
    msg('Prompts file update ho rahi hai...');
    return gh('GET',base+enc(path)+'?ref='+encodeURIComponent(br));
  }).then(function(f){
    var txt=b64dec(f.content),i=txt.lastIndexOf('];');
    if(i<0)throw new Error('File me aakhri "];" nahi mila.');
    var before=txt.slice(0,i).replace(/\s+$/,'');
    if(!/,$/.test(before)&&!/\[$/.test(before))before+=',';
    var out=before+'\n'+block+'\n'+txt.slice(i);
    return gh('PUT',base+enc(path),{message:'Add prompt: '+title,content:b64enc(out),sha:f.sha,branch:br});
  }).then(function(){
    msg('Ho gaya ✓ "'+title+'" GitHub par add ho gaya. Site update hone me thoda time lag sakta hai.','var(--ok)');
    $('title').value='';$('prompt').value='';$('img').value='';$('wm').checked=false;picked=null;sel={Trending:true};chips();build();
  }).catch(function(e){
    msg(e.status===401||e.status===403?'Token galat hai ya permission nahi hai (Contents: Read and write chahiye).':e.status===404?'Repo, branch ya file path nahi mila. Settings check karo.':'Error: '+e.message,'var(--er)');
  }).then(function(){btn.disabled=false});
};
$('pick').onclick=function(){$('file').click()};
$('file').onchange=function(e){var f=e.target.files[0];if(f){picked=f;$('img').value=($('dir').value.trim()||'images')+'/'+f.name;build()}};
$('addtag').onclick=function(){var v=$('ctag').value.trim();if(!v)return;if(TAGS.indexOf(v)<0)TAGS.push(v);sel[v]=true;$('ctag').value='';chips();build()};
['img','title','prompt'].forEach(function(i){$(i).addEventListener('input',build)});
$('wm').onchange=build;chips();build();
</script>
</body>
</html>
