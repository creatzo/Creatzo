<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>creatzo Admin</title>
<meta name="theme-color" content="#f4f3f8">
<script src="theme.js"></script>
<style>
:root{
  --bg:#f4f3f8;--card:#ffffff;--card2:#f1f0f6;--tx:#17151f;--mu:#6b6880;--bd:#e3e1ee;
  --ac:#7c3aed;--ac2:#db2777;--ok:#15803d;--er:#dc2626;--shadow:0 1px 2px rgba(20,10,60,.05),0 8px 24px rgba(20,10,60,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0b12;--card:#16141f;--card2:#1e1b2a;--tx:#f3f1fa;--mu:#9a96b0;--bd:#2a2738;
  --ac:#8b5cf6;--ac2:#ec4899;--ok:#4ade80;--er:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
/* theme.js colors (random on every refresh) */
html[data-creatzo]{--tx:var(--fg);--mu:var(--mute);--bd:var(--line);--ac:var(--accent);--acf:var(--accent-fg);--ac2:color-mix(in srgb,var(--accent) 68%,var(--fg))}
html[data-creatzo][data-theme="light"]{--card:color-mix(in srgb,var(--bg) 35%,#fff);--card2:color-mix(in srgb,var(--bg) 92%,var(--fg));--ok:#15803d;--er:#dc2626}
html[data-creatzo][data-theme="dark"]{--card:color-mix(in srgb,var(--bg) 94%,#fff);--card2:color-mix(in srgb,var(--bg) 88%,#fff);--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:620px;margin:0 auto;padding:18px 16px 130px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.wm{height:30px;width:auto;display:block;filter:brightness(0)}
@media (prefers-color-scheme:dark){html:not([data-theme]) .wm{filter:none}}
html[data-theme="dark"] .wm{filter:none}
html[data-theme="light"] .wm{filter:brightness(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 18px rgba(124,58,237,.35)}
h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.01em}
.tag{font-size:12.5px;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu);display:block}
.pill.on{color:var(--ok)}.pill.on i{background:var(--ok)}
.pill.off{color:var(--er)}.pill.off i{background:var(--er)}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.num{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf,#fff);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.ch h2{font-size:15px;margin:0;font-weight:700}
.ch .sp{flex:1}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:14px 0 6px;letter-spacing:.01em}
label.l:first-of-type{margin-top:0}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:12px 13px;outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus{border-color:var(--ac);background:var(--card)}
textarea{min-height:210px;resize:vertical;line-height:1.5}
::placeholder{color:var(--mu);opacity:.7}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;padding:12px 16px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{width:100%;color:var(--acf,#fff);font-size:16px;padding:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.sec{background:var(--card2);color:var(--tx);border:1.5px solid var(--bd);padding:11px 15px;white-space:nowrap}
.btn.link{background:none;color:var(--ac);padding:4px 2px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}

/* image */
.imgbox{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.thumb{width:76px;height:96px;border-radius:12px;background:var(--card2);border:1.5px dashed var(--bd);display:grid;place-items:center;color:var(--mu);font-size:11px;text-align:center;overflow:hidden;flex:none;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgbox .meta{flex:1;min-width:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;transition:all .12s}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--acf,#fff);font-weight:600}

/* switch */
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px}
.opt b{font-size:14.5px;display:block}
.opt span{font-size:12.5px;color:var(--mu)}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:background .15s;outline:none;margin:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sw:checked:after{transform:translateX(20px)}
.opt+.opt{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}

.count{font-size:12px;color:var(--mu);text-align:right;margin-top:6px}

/* preview + settings */
details{border-radius:18px}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{margin-left:auto;transition:transform .15s;color:var(--mu)}
details[open]>summary .chev{transform:rotate(180deg)}
details .body{margin-top:14px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card2);border-radius:12px;padding:12px;max-height:260px;overflow:auto;color:var(--tx)}
.hint{font-size:12.5px;color:var(--mu);margin:10px 0 0}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.bar .in{max-width:620px;margin:0 auto}
#msg{font-size:13.5px;margin:0 0 9px;min-height:0;word-break:break-word;display:none;padding:10px 12px;border-radius:11px;background:var(--card2)}
#msg.show{display:block}
#msg.ok{color:var(--ok)}#msg.er{color:var(--er)}
</style>
</head>

<script>
var TAGS=['Trending','Boys','Girls','Black','Portrait','Photography','Green','Gredients','19s'],sel={Trending:true},picked=null,prev=null;
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
function pill(){var ok=$('tok').value.trim()&&$('repo').value.trim();$('pill').className='pill '+(ok?'on':'off');$('pt').textContent=ok?'Ready':'Setup needed'}
['tok','repo','br','path','dir'].forEach(function(k){var v=ls('cz_'+k);if(v)$(k).value=v;$(k).addEventListener('input',function(){ls('cz_'+k,$(k).value.trim());pill()})});
if(!$('tok').value||!$('repo').value)$('set').open=true;
pill();

function esc(s){return s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${')}
function q(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function chips(){var h=$('chips');h.innerHTML='';TAGS.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='chip'+(sel[t]?' on':'');b.textContent=t;b.onclick=function(){sel[t]=!sel[t];chips();build()};h.appendChild(b)})}
function build(){
  var c="  {\n    image: '"+q($('img').value.trim())+"',\n";
  if($('wm').checked)c+="    watermark: false,\n";
  c+="    title: '"+q($('title').value.trim())+"',\n    tags: ["+TAGS.filter(function(t){return sel[t]}).map(function(t){return "'"+q(t)+"'"}).join(', ')+"],\n";
  c+="    prompt: `"+esc($('prompt').value.trim())+"`\n  },";
  $('out').textContent=c;
  var n=$('prompt').value.trim().length;$('cnt').textContent=n.toLocaleString()+' characters';
  return c;
}
function msg(t,type){var m=$('msg');if(!t){m.className='';m.textContent='';return}m.textContent=t;m.className='show '+(type||'')}
function b64dec(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(s){var u=new TextEncoder().encode(s),r='';for(var i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(r)}
function fileB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}
function gh(method,url,body){
  return fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+$('tok').value.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.message||('Error '+r.status));e.status=r.status;throw e}return j});
  });
}
function enc(p){return p.split('/').map(encodeURIComponent).join('/')}
function errText(e){return e.status===401||e.status===403?'Invalid token or missing permission (needs write access to repository contents).':e.status===404?'Repository, branch or file path not found. Check your settings.':'Error: '+e.message}
function resetThumb(){if(prev){URL.revokeObjectURL(prev);prev=null}$('thumb').innerHTML='No image<br>selected'}

$('test').onclick=function(){
  var repo=$('repo').value.trim();if(!$('tok').value.trim()||!repo){msg('Enter your token and repository first.','er');return}
  var b=$('test');b.disabled=true;b.textContent='Testing…';
  gh('GET','/repos/'+repo).then(function(j){
    var w=j.permissions&&j.permissions.push;
    msg((w?'Connected to ':'Read-only access to ')+j.full_name+(w?' with write access.':'. You need write access.'),w?'ok':'er');
  }).catch(function(e){msg(errText(e),'er')}).then(function(){b.disabled=false;b.textContent='Test connection'});
};

$('go').onclick=function(){
  var img=$('img').value.trim(),title=$('title').value.trim(),p=$('prompt').value.trim(),repo=$('repo').value.trim(),br=$('br').value.trim()||'main',path=$('path').value.trim(),tok=$('tok').value.trim();
  if(!tok||!repo||!path){$('set').open=true;window.scrollTo({top:0});msg('Fill in the GitHub settings first.','er');return}
  if(!img||img==='images/.webp'||!title||!p){msg('Image, title and prompt are all required.','er');return}
  var block=build(),btn=$('go');btn.disabled=true;btn.textContent='Publishing…';msg('Reading prompts file…');
  var base='/repos/'+repo+'/contents/';
  var step=Promise.resolve();
  if(picked&&$('up').checked){
    var ipath=(img.indexOf('/')<0?($('dir').value.trim()||'images')+'/':'')+img.replace(/^\.?\//,'');
    step=fileB64(picked).then(function(b){
      msg('Uploading image…');
      return gh('GET',base+enc(ipath)+'?ref='+encodeURIComponent(br)).then(function(j){return j.sha},function(e){if(e.status===404)return null;throw e}).then(function(sha){
        var body={message:'Add image: '+picked.name,content:b,branch:br};if(sha)body.sha=sha;return gh('PUT',base+enc(ipath),body);
      });
    });
  }
  step.then(function(){
    msg('Updating prompts file…');
    return gh('GET',base+enc(path)+'?ref='+encodeURIComponent(br));
  }).then(function(f){
    var txt=b64dec(f.content),i=txt.lastIndexOf('];');
    if(i<0)throw new Error('Could not find the closing "];" in the file.');
    var before=txt.slice(0,i).replace(/\s+$/,'');
    if(!/,$/.test(before)&&!/\[$/.test(before))before+=',';
    var out=before+'\n'+block+'\n'+txt.slice(i);
    return gh('PUT',base+enc(path),{message:'Add prompt: '+title,content:b64enc(out),sha:f.sha,branch:br});
  }).then(function(){
    msg('Done ✓ "'+title+'" was added. The site updates after the next deploy.','ok');
    $('title').value='';$('prompt').value='';$('img').value='images/.webp';$('wm').checked=false;picked=null;resetThumb();sel={Trending:true};chips();build();
  }).catch(function(e){msg(errText(e),'er')}).then(function(){btn.disabled=false;btn.textContent='Publish to GitHub'});
};

$('pick').onclick=$('thumb').onclick=function(){$('file').click()};
$('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  picked=f;$('img').value=($('dir').value.trim()||'images')+'/'+f.name;
  if(prev)URL.revokeObjectURL(prev);prev=URL.createObjectURL(f);
  $('thumb').innerHTML='<img alt="" src="'+prev+'">';build();
};
$('addtag').onclick=function(){var v=$('ctag').value.trim();if(!v)return;if(TAGS.indexOf(v)<0)TAGS.push(v);sel[v]=true;$('ctag').value='';chips();build()};
['img','title','prompt'].forEach(function(i){$(i).addEventListener('input',build)});
$('img').addEventListener('focus',function(){var t=this,v=t.value;if(/\.webp$/.test(v)){setTimeout(function(){t.setSelectionRange(v.length-5,v.length-5)},0)}});
$('wm').onchange=build;chips();build();
</script>
</body>
</html>
